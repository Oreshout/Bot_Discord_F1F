{% load social_django %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c2f33;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        .login-container {
            background: #23272a;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
        }
        a.discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
        }
        a.discord-btn:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Connexion</h1>
        <p>Connectez-vous avec votre compte Discord :</p>

        <!-- Lien de connexion avec Discord -->
        <a href="{% url 'social:begin' 'discord' %}" class="discord-btn">
            🔑 Se connecter avec Discord
        </a>
    </div>
</body>
</html>
